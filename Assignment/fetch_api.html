<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY_shop</title>
    <style>
        table{
            border: 2px solid red;
            margin: auto;
            width: 80%;
            padding :10px;
            font-size :25px;
            color:red;
            border-collapse: collapse;
        }
       img{
        width:100px;
        height:100px;
       }
        </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>S.No</th>
                <th>Title</th>
                <th>Image</th>
                <th>Category</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody id ="data">
           

        </tbody>
    </table>
    <script>
          const ele =document.getElementById("data");
          const URL ="https://dummyjson.com/products";
         async function loadData(){
         try{
            const res=  await fetch(URL);
            const data = await res.json();
            console.log("DATA",data.products);
            let row ="";
            data.products.map((i, index)=>{
             row+=`
             <tr>
                <td>${index+1}</td>
                <td>${i.title}</td>
                <td><img src="${i.images [0]}"/></td>
                <td>${i.category}</td>
                <td>${i.price}</td>
            </tr>
            `;
            ele.innerHTML=row;
         })
        }
         catch(err){
             console.error("Error fetching data:", err);
         }
          }
          loadData();
    </script>
</body>
</html>
