<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 1</title>
    <style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 20px;
  }

  #product {
    width: 60%;
    margin: 20px auto;
    text-align: center;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  th, td {
    padding: 12px;
    border: 1px solid #ddd;
  }

  th {
    background: #007acc;
    color: white;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  tr:nth-child(even) {
    background: #f9f9f9;
  }

  #orderForm {
    width: 60%;
    margin: auto;
    background: #fff;
    padding: 20px;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  label {
    font-weight: bold;
    margin-right: 10px;
  }

  input, select {
    padding: 8px;
    margin: 8px 0;
    width: 60%;
    border: 1px solid #ccc;
    border-radius: 4px;
  }

  input[type="submit"] {
    background: #007acc;
    color: white;
    border: none;
    cursor: pointer;
    width: auto;
    padding: 10px 20px;
    font-weight: bold;
    border-radius: 4px;
  }

  input[type="submit"]:hover {
    background: #005fa3;
  }

  #demo {
    width: 60%;
    margin: 20px auto;
    font-size: 1.1em;
    font-weight: bold;
    color: #333;
    text-align: center;
  }
</style>

</head>
<body>
    
        <div id="product" style="width: 50%; margin: auto; text-align: center;">
            <table border="1">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Price</th>
                    </tr>
                </thead>
                <tr>
                    <td>Tea</td>
                    <td>450</td>
                </tr>
                <tr>
                    <td>Coffee</td>
                    <td>600</td>
                </tr>
                <tr>
                    <td>Sugar</td>
                    <td>700</td>
                </tr>
                <tr>
                    <td>Pulses</td>
                    <td>100</td>
                </tr>
            </table>
        </div>

        <form id="orderForm" style="width: 50%; margin: auto; text-align: center;">
            <label for="item">Item:</label>
            <select id="item" name="item">
                <option value="tea">Tea</option>
                <option value="coffee">Coffee</option>
                <option value="sugar">Sugar</option>
                <option value="pulses">Pulses</option>
            </select>
            <br><br>
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" min="1">
            <br><br>
            <input type="submit" value="Calculate Total">
        </form>
   
        <p id="demo"> </p>

    <script>
        const product={
            tea:450,
            coffee:600,
            sugar:700,
            pulses:100,
        };


   document.getElementById("orderForm").addEventListener("submit", function(e) {
      e.preventDefault(); // stop page reload

      let item = document.getElementById("item").value.toLowerCase();
      let quantity = parseInt(document.getElementById("quantity").value);

      if (item in product) {
        let price = product[item];
        let total = price * quantity;
        document.getElementById("demo").innerHTML =
          "The price of " + item + " is: " + price +
          "<br>Total price of " + quantity + " " + item + " is: " + total;
      } else {
        document.getElementById("demo").innerHTML = "Item not found";
      }
    });

    </script>
    
</body>
</html>
