<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var num= prompt("Enter a number of which table you want :");
        let i=1;
        while(i<=10){
            document.write("<br>");
            document.write(num+" * "+i+" = "+num*i);
            i++;
        }
    </script>
    
</body>
</html>
