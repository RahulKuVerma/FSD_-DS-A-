<body>
    <script>

        const num=[11,45,51,78,90,100,200,300,400,500];
        const evenNum=num.filter((value)=>{
             return value%2==0;
        });
        console.log("num: ", num);
        console.log("evenNum: ", evenNum);
        
        /* this can also be written in one line as below

        )); */
    </script>
