<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        car=[];
        for(let i=0; i<5; i++){
            car[i]=prompt("Enter the name of car "+(i+1));
        }
        document.write("<br>");
        for(let i=0; i<5; i++){
            document.write(car[i]+"<br>");
        }
        const bikes=["KTM","Royal Enfield","Yamaha","Honda"];
        document.write("<br>");
        for(let i=0; i<bikes.length; i++){
            document.write(bikes[i]+"<br>");
        }
    </script>
</body>
</html>
