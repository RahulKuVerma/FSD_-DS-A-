<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condition</title>
</head>
<body>
    <script>
           let a=112;
           let b=20; 
        if(a>b){
        document.write("<br>");
        document.write("a is greater than b");
      }
      else{
        document.write("<br>");
        document.write("b is greater than a");
      }
    </script>
</body>
</html>
