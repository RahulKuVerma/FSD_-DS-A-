<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        var num= prompt("Enter a number to check if it is an Armstrong number or not:");
        let sum=0;
        let temp=num;
        while(temp>0){
            let rem=temp%10;
            sum+=rem*rem*rem;
            temp=parseInt(temp/10);
        }
        if(sum==num){
            document.write("<br>");
            document.write(num+" is an Armstrong number");
        }
        else{
            document.write("<br>");
            document.write(num+" is not an Armstrong number");
        }
    </script>
</body>
</html>
